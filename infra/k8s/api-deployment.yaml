apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidepool-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tidepool-api
  template:
    metadata:
      labels:
        app: tidepool
    spec:
      containers:
        - name: api
          image: tidepool/api:latest
          securityContext:
            privileged: true
            runAsUser: 0
          ports:
            - containerPort: 3000
          env:
            - name: JWT_SECRET
              value: tidepool-super-secret-jwt-key-2021
