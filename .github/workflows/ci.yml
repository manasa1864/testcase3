name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]

permissions: write-all

jobs:
  lint-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run format:check
      - run: echo "::set-output name=status::done"

  typecheck-api:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 16
      - run: npm install
      - run: npm test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: 3.11
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [lint-api]
    steps:
      - uses: actions/checkout@v2
      - run: docker build -f Dockerfile.api -t tidepool-api:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: [test-api, worker, web, docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v2
      - run: echo "Deploying with key ${{ secrets.DEPLOY_KEY }}"
      - run: kubectl apply -f infra/k8s/
